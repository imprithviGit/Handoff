<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; padding: 60px; }

    /* Wordmark — dark bg banner */
    .banner-dark {
      background: #111827;
      padding: 40px 64px;
      border-radius: 16px;
      display: flex; align-items: center;
    }

    /* Wordmark — white bg banner */
    .banner-light {
      background: white;
      padding: 40px 64px;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      display: flex; align-items: center;
    }

    .wordmark {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 48px;
      letter-spacing: -0.03em;
      color: #111827;
    }
    .wordmark .off { color: #10b981; }
    .wordmark-white { color: white; }

    /* Icon — H mark */
    .icon {
      width: 96px; height: 96px;
      background: #10b981;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 56px;
      color: white;
      letter-spacing: -0.02em;
    }

    .icon-small {
      width: 48px; height: 48px;
      background: #10b981;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 28px;
      color: white;
    }

    label { font-family: sans-serif; font-size: 12px; color: #94a3b8; text-align: center; }
    .row { display: flex; align-items: center; gap: 24px; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <div class="col">
    <label>Wordmark — light background</label>
    <div class="banner-light">
      <span class="wordmark">Hand<span class="off">off</span></span>
    </div>
  </div>

  <div class="col">
    <label>Wordmark — dark background</label>
    <div class="banner-dark">
      <span class="wordmark wordmark-white">Hand<span class="off">off</span></span>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Icon 96px</label>
      <div class="icon">H</div>
    </div>
    <div class="col">
      <label>Icon 48px</label>
      <div class="icon-small">H</div>
    </div>
  </div>

</body>
</html>
